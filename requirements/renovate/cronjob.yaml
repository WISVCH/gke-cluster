apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          serviceAccountName: renovate
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: github-app-token
              image: ghcr.io/mshekow/github-app-installation-token:latest@sha256:3ee7d5b1eae1333aa457e90f3822edcb715ccb4a5536b544714186202a43f7a8 # {"$imagepolicy": "flux-system:github-app-installation-token"}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 027
                  node /app/index.js "$RENOVATE_GITHUB_APP_ID" "$RENOVATE_GITHUB_APP_INSTALLATION_ID" /github-app/private-key.pem > /token/token
                  test -s /token/token
              env:
                - name: RENOVATE_GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-github-app
                      key: app-id
                - name: RENOVATE_GITHUB_APP_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-github-app
                      key: installation-id
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 1000
              volumeMounts:
                - name: github-app
                  mountPath: /github-app
                  readOnly: true
                - name: token
                  mountPath: /token
          containers:
            - name: renovate
              image: renovate/renovate:44.181.5@sha256:611eac05a6ee11c06d23157ae2ca11364f5b4a096c12d7f82a65aec2b6ec8a48 # {"$imagepolicy": "flux-system:renovate"}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  export RENOVATE_TOKEN="$(cat /token/token)"
                  mkdir -p /tmp/renovate/home /tmp/renovate/cache
                  exec renovate
              env:
                - name: HOME
                  value: /tmp/renovate/home
                - name: LOG_FORMAT
                  value: json
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_BASE_DIR
                  value: /tmp/renovate
                - name: RENOVATE_CACHE_DIR
                  value: /tmp/renovate/cache
                - name: RENOVATE_CONFIG_FILE
                  value: /usr/src/app/config.js
              resources:
                requests:
                  cpu: 100m
                  memory: 900Mi
                limits:
                  cpu: 500m
                  memory: 1229Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 12021
              volumeMounts:
                - name: renovate-config
                  mountPath: /usr/src/app/config.js
                  subPath: config.js
                  readOnly: true
                - name: token
                  mountPath: /token
                  readOnly: true
                - name: work
                  mountPath: /tmp
          volumes:
            - name: github-app
              secret:
                secretName: renovate-github-app
                defaultMode: 0440
            - name: renovate-config
              configMap:
                name: renovate-config
            - name: token
              emptyDir:
                medium: Memory
            - name: work
              emptyDir: {}
