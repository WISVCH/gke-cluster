apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hackdelft
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: ./static-site
      version: "0.1.x"
      interval: 15m
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: wisvch
        namespace: flux-system
  values:
    nameOverride: hackdelft
    fullnameOverride: hackdelft
    domains:
      - hackdelft.nl
    replicaCount: 1
    containerPort: 8080
    service:
      type: ClusterIP
      port: 80
    image:
      repository: ghcr.io/wisvch/hack-delft-2026
      tag: 20260802-014a5db # {"$imagepolicy": "flux-system:hackdelft-2026:tag"}
      pullPolicy: IfNotPresent
      pullSecrets: {}
    resources: # 7d peak: 26Mi non-evictable memory and negligible CPU; reserve idle use and allow traffic bursts.
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
