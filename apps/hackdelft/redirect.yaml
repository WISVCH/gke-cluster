apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: hackdelft-com-redirect
  namespace: default
spec:
  parentRefs:
    - kind: Gateway
      namespace: gateway-infra
      name: gateway
  hostnames:
    - hackdelft.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: hackdelft.nl
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: hackdelft-2026-com-redirect
  namespace: default
spec:
  parentRefs:
    - kind: Gateway
      namespace: gateway-infra
      name: gateway
  hostnames:
    - 2026.hackdelft.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: 2026.hackdelft.nl
            statusCode: 301
