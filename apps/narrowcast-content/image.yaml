apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: narrowcast-content
  namespace: flux-system
spec:
  image: ghcr.io/wisvch/narrowcast-content
  interval: 15m0s
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: narrowcast-content
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: narrowcast-content
  filterTags:
    pattern: "^(?P<ts>.*)-[a-fA-F0-9]+"
    extract: "$ts"
  policy:
    numerical:
      order: asc
