apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: choice
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: ./choice
      version: "0.1.x"
      interval: 15m
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: wisvch
        namespace: flux-system
  values:
    replicaCount: 1
    serviceAccountName: choice
    image:
      repository: ghcr.io/wisvch/choice
      tag: 20240802-5c0c8f5 # {"$imagepolicy": "flux-system:choice:tag"}
    resources: # 7d peak: 346Mi non-evictable memory and 13m CPU; retain JVM startup and request headroom.
      requests:
        cpu: 25m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi
    postgres:
      database: choice
      host: 127.0.0.1
      port: 5432
      username: choice@wisvch.iam
      password: choice
      cloudSQL: true
      cloudSQLProxy:
        instanceConnectionName: wisvch:europe-west4:geurt
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
    hibernate:
      generateDdl: true
      hb2mddl:
        auto: validate
    flyway:
      enable: false
