apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: chipcie-website
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: ./static-site
      version: "0.1.x"
      interval: 15m
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: wisvch
        namespace: flux-system
  values:
    fullnameOverride: chipcie
    domains:
      - chipcie.wisv.ch
    replicaCount: 1
    containerPort: 8080
    service:
      type: ClusterIP
      port: 80
    image:
      repository: ghcr.io/wisvch/chipcie-website
      tag: 20260724-900536c # {"$imagepolicy": "flux-system:chipcie-website:tag"}
      pullPolicy: IfNotPresent
      pullSecrets: {}
    resources: # 7d peak: 907Mi non-evictable + 1052Mi cache; reserve a small floor and allow cache/traffic bursts.
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 3Gi
