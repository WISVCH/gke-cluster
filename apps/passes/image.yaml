apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: passes
  namespace: flux-system
spec:
  image: ghcr.io/wisvch/passes
  interval: 5m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: passes
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: passes
  filterTags:
    pattern: "^[0-9]{8}-(?P<run>[0-9]+)-[a-fA-F0-9]+$"
    extract: "$run"
  policy:
    numerical:
      order: asc
